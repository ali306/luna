[package]
name = "luna-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luna_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
objc2-encode = "4.1.0"
bitflags = "2.9.3"
log = "0.4.28"

# Web server
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }

ollama-rs = "0.2"

# TTS
ort = { version = "2.0.0-rc.10", features = ["ndarray", "half", "download-binaries"] }
ndarray = "0.16"
fancy-regex = "0.16.2"
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
rodio = { version = "0.17", features = ["symphonia-all"] }

# Utilities
thiserror = "1.0"
tracing-subscriber = "0.3"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
url = "2.5"
base64 = "0.22"
anyhow = "1"
bytes = "1"
tokio = { version = "1", features = ["fs", "process", "rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
hound = "3"
tempfile = "3.8"
whisper-rs = "0.15.1"

[dev-dependencies]
mockito = "1.4"
tokio-test = "0.4"
serial_test = "3.0"
tempfile = "3.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"

[features]
default = []
download = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
